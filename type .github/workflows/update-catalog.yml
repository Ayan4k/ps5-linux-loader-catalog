name: Update catalog

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="soniciso1/ps5-linux-loader"
          REL=$(gh api "repos/$SRC/releases/latest")
          TAG=$(jq -r .tag_name <<<"$REL")
          DATE=$(jq -r '.published_at[:10]' <<<"$REL")
          ASSET=$(jq -r '[.assets[] | select(.name | endswith(".elf"))][0].name' <<<"$REL")
          URL=$(jq -r '[.assets[] | select(.name | endswith(".elf"))][0].browser_download_url' <<<"$REL")
          CUR=$(jq -r '.payloads[] | select(.id=="ps5-linux-loader") | .version' payloads.json)

          if [ "$ASSET" = "null" ] || [ "$TAG" = "$CUR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -fsSL -o /tmp/payload.elf "$URL"
          SUM=$(sha256sum /tmp/payload.elf | cut -d' ' -f1)

          jq --arg v "$TAG" --arg d "$DATE" --arg f "$ASSET" --arg u "$URL" --arg c "$SUM" \
            '(.payloads[] | select(.id=="ps5-linux-loader")) |= (.version=$v | .last_update=$d | .filename=$f | .url=$u | .checksum=$c)' \
            payloads.json > /tmp/payloads.json
          mv /tmp/payloads.json payloads.json

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          SUM: ${{ steps.check.outputs.sum }}
        run: |
          set -euo pipefail
          BRANCH="update-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "Update PS5 Linux Loader to $TAG"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update PS5 Linux Loader to $TAG" \
            --body "New upstream release: https://github.com/soniciso1/ps5-linux-loader/releases/tag/$TAG

          SHA-256 of the downloaded file: \`$SUM\`

          Compare it with the checksum in the release notes before merging."
